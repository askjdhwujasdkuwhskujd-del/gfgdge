<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141414">
    <meta name="description" content="Framered is a creator-first video platform for framered.lat.">
    <title>Framered</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Framered home">
        <span class="menu-icon" aria-hidden="true">☰</span>
        <span class="brand-mark">FR</span>
        <span class="brand-word">Framered</span>
      </a>

      <form class="search" id="searchForm" role="search">
        <input id="searchInput" name="q" type="search" autocomplete="off" placeholder="Search frames, creators, tags">
        <button type="submit" aria-label="Search">
          <span aria-hidden="true">⌕</span>
        </button>
      </form>

      <nav class="top-actions" aria-label="Account actions">
        <button class="round-button" id="followingButton" type="button" aria-label="Following">◇</button>
        <button class="create-button" id="uploadButton" type="button"><span>＋</span> Create</button>
        <button class="round-button" type="button" aria-label="Notifications">◦</button>
        <button class="avatar-button" id="accountButton" type="button" aria-label="Account">Sign in</button>
      </nav>
    </header>

    <main class="app-shell">
      <aside class="side-rail" aria-label="Main navigation">
        <div class="rail-section">
          <button class="rail-item active" data-nav="discover" type="button"><span>⌂</span><strong>Home</strong></button>
          <button class="rail-item" type="button"><span>▱</span><strong>Shorts</strong></button>
          <button class="rail-item" data-nav="subscriptions" type="button"><span>◇</span><strong>Subscriptions</strong></button>
        </div>
        <div class="rail-section">
          <p>You</p>
          <button class="rail-item" data-nav="upload" type="button"><span>↑</span><strong>Your videos</strong></button>
          <button class="rail-item" type="button"><span>↺</span><strong>History</strong></button>
          <button class="rail-item" type="button"><span>≡</span><strong>Playlists</strong></button>
          <button class="rail-item" type="button"><span>♡</span><strong>Liked videos</strong></button>
        </div>
        <div class="rail-section">
          <p>Explore</p>
          <button class="rail-item" type="button"><span>▣</span><strong>Trending</strong></button>
          <button class="rail-item" type="button"><span>♪</span><strong>Music</strong></button>
          <button class="rail-item" type="button"><span>▤</span><strong>Films</strong></button>
          <button class="rail-item" type="button"><span>◉</span><strong>Gaming</strong></button>
        </div>
        <div class="rail-section muted-section">
          <p>Framered</p>
          <small>framered.lat</small>
        </div>
      </aside>

      <section class="content" id="app" aria-live="polite"></section>
    </main>

    <dialog class="auth-dialog" id="authDialog">
      <form class="auth-panel" id="authForm" method="dialog">
        <button class="icon-button close-button" id="closeAuth" type="button" aria-label="Close">×</button>
        <div>
          <p class="eyebrow">framered.lat</p>
          <h2 id="authTitle">Sign in</h2>
        </div>
        <label>
          Username
          <input id="authUsername" name="username" type="text" required autocomplete="username" minlength="2" maxlength="24">
        </label>
        <label class="register-only">
          Display name
          <input id="authName" name="name" type="text" autocomplete="name">
        </label>
        <label>
          Password
          <input id="authPassword" name="password" type="password" required autocomplete="current-password" minlength="6">
        </label>
        <p class="form-error" id="authError"></p>
        <button class="primary-button wide" id="authSubmit" type="submit">Sign in</button>
        <button class="link-button" id="toggleAuthMode" type="button">Create an account</button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/app.js" defer></script>
  </body>
</html>
